# Render "Blueprint": New + > Blueprint > pick this repository.
services:
  - type: web
    name: swadharma-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free
    healthCheckPath: /health
    envVars:
      # Asked for in the Render dashboard (not stored in this file).
      # Use the App ID of an Agora project in "Testing mode".
      - key: AGORA_APP_ID
        sync: false
      - key: DATA_FILE
        value: /app/data/db.json
      # The browser astrologer console has no login. Set to "false" to switch it off.
      - key: ENABLE_CONSOLE
        value: "true"
      # Customers sign in with Firebase SMS when this is set (the Firebase project
      # id, e.g. "astro-co"). Leave empty for the on-screen demo code.
      - key: FIREBASE_PROJECT_ID
        sync: false
