# Fly.io:  cd server && fly launch --no-deploy --copy-config && fly deploy
app = "swadharma-api"
primary_region = "bom"

[build]

[env]
  PORT = "8080"
  DATA_FILE = "/app/data/db.json"
  ENABLE_CONSOLE = "true"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
